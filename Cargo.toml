[package]
name = "worktree-monitor"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
notify = "9.0.0"
notify-debouncer-mini = "0.8.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "wtm"
path = "src/main.rs"
