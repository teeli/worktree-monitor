version: 2

# Minor and patch updates are bundled into one weekly PR per ecosystem. Semver-major updates
# match no group, so each gets its own PR (they usually need code changes).
# Multi-ecosystem groups don't document update-type filtering, hence per-ecosystem groups.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
