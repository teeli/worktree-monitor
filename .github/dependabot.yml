version: 2

# Bundle all Cargo and GitHub Actions updates into a single weekly PR.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: cargo
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
